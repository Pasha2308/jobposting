name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Astro check
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Vercel configuration
        run: node -e "const cfg = require('./vercel.json'); if (!Array.isArray(cfg.crons) || cfg.crons.length === 0) { throw new Error('vercel.json must declare the recovery cron'); } console.log('vercel.json OK:', cfg.crons.map((c) => c.path + ' @ ' + c.schedule).join(', '));"

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            check.log
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Database migrations (PostgreSQL 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create database hc_test;"

      - name: Supabase compatibility stub
        run: psql -h localhost -U postgres -d hc_test -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stub.sql

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d hc_test -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done

      - name: Migration smoke tests
        run: psql -h localhost -U postgres -d hc_test -v ON_ERROR_STOP=1 -f supabase/tests/01_smoke.sql

  e2e:
    name: Public E2E (desktop + mobile)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public journeys
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
