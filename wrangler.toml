# Cloudflare Pages configuration for Wrangler.
# Secrets must NOT be stored here. Add them in the Pages project settings.

name = "hustlercommunity-opportunities"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[vars]
PUBLIC_SITE_URL = "https://hustlercommunity-opportunities.pages.dev"

# Astro sessions are enabled by the Cloudflare adapter. This app does not use
# them for admin auth (admin sessions use HttpOnly cookies), so the binding is
# only needed if you later add Astro session storage. Create a KV namespace in
# the Cloudflare dashboard, then uncomment and paste its id.
# [[kv_namespaces]]
# binding = "SESSION"
# id = "replace-with-kv-namespace-id"
